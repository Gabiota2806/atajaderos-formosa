services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: atajaderos_backend
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atajaderos}:${POSTGRES_PASSWORD:-atajaderos_secret}@postgres:5432/${POSTGRES_DB:-atajaderos}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atajaderos}:${POSTGRES_PASSWORD:-atajaderos_secret}@postgres:5432/atajaderos_test
    volumes:
      - ./apps/backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: atajaderos_frontend
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:18-3.7
    container_name: atajaderos_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atajaderos}
      POSTGRES_USER: ${POSTGRES_USER:-atajaderos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atajaderos_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atajaderos} -d ${POSTGRES_DB:-atajaderos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-testing-db.sql:/docker-entrypoint-initdb.d/init-testing-db.sql:ro

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local
  uploads_data:
    driver: local
